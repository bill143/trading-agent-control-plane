name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

jobs:
  checks:
    name: lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Install pinned Python and locked dependencies
        run: uv sync --frozen
      - name: Toolchain matches pins
        run: uv run python -m tools.check_toolchain
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests (risk layer coverage must stay at or above 90%)
        run: uv run pytest --cov=risk --cov-report=term --cov-fail-under=90
      - name: Build status valid and in sync
        run: uv run python -m tools.build_status validate

  windows-setup:
    name: Windows dev environment setup script
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run scripts/setup-windows.ps1 from a clean runner
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup-windows.ps1

  windows-installer:
    name: Windows installer (build, install, launch, uninstall)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Bundle the app with PyInstaller
        run: uv run pyinstaller packaging/TradingSystem.spec --noconfirm --distpath dist --workpath build
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" | Select-Object -First 1 }
            $env:PATH = "$($iscc.DirectoryName);$env:PATH"
          }
          iscc /DSourceDir="$PWD\dist\TradingSystem" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Sign the installer (when a code-signing certificate is configured)
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_BASE64) { Write-Host "No code-signing certificate configured: installer is unsigned (DECISIONS.md D-08)."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\installer\*.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx -Force
      - name: Install silently, check the desktop icon, launch, health-check over HTTPS, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\TradingSystem-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/TASKS="desktopicon"','/NORESTART' -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\TradingSystem\TradingSystem.exe"
          if (-not (Test-Path $exe)) { throw "TradingSystem.exe was not installed" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Trading System.lnk"
          if (-not (Test-Path $lnk)) { throw "desktop icon missing" }
          $env:TACP_HOME = Join-Path $env:RUNNER_TEMP "tacp-home"
          $p = Start-Process $exe -ArgumentList '--server-only','--port','8799' -PassThru
          $ok = $false
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 2
            try {
              $r = & curl.exe -s -k https://127.0.0.1:8799/api/health
              if ($r -match '"status":"ok"') { $ok = $true; Write-Host $r; break }
            } catch {}
          }
          $p | Stop-Process -Force
          if (-not $ok) { Get-Content (Join-Path $env:TACP_HOME "logs\app.log") -ErrorAction SilentlyContinue; throw "installed app did not answer over HTTPS" }
          $unins = Join-Path $env:LOCALAPPDATA "Programs\TradingSystem\unins000.exe"
          Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "uninstall left the app behind" }
          Write-Host "install -> launch -> HTTPS health -> uninstall: OK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TradingSystem-Setup
          path: dist/installer/*.exe
          retention-days: 30

  ui-walkthrough:
    name: UI walkthrough (screenshots and video)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start the app (engine + HTTPS API) and walk through every screen
        run: |
          export TACP_HOME="$RUNNER_TEMP/tacp"
          uv run python -m app.main --server-only --port 8765 > "$RUNNER_TEMP/app.out" 2>&1 &
          for i in $(seq 1 90); do grep -q READY "$RUNNER_TEMP/app.out" && break; sleep 1; done
          PIN=$(uv run python -c "from api.tls import spki_pin; from pathlib import Path; import os; print(spki_pin(Path(os.environ['TACP_HOME'], 'state/tls/api-cert.pem').read_bytes()))")
          mkdir -p tests/e2e/out
          cd tests/e2e && node walkthrough.js https://127.0.0.1:8765/ "$PIN" ./out video | tee out/walkthrough.log
          grep -q 'errors \[\]' out/walkthrough.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-walkthrough
          path: tests/e2e/out
          retention-days: 30

  dependency-audit:
    name: dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: pip-audit against the lock file
        run: |
          uv export --frozen --all-groups --no-emit-project -o requirements-audit.txt
          uv run pip-audit --strict --disable-pip -r requirements-audit.txt

  secret-scan:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks v8.30.0 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
