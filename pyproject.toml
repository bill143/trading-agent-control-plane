[project]
name = "trading-agent-control-plane"
version = "0.1.0"
description = "Multi-Expert AI Trading System for Bill: engine, risk layer, control API and apps."
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Proprietary - all rights reserved by the repository owner" }
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "databento>=0.60",
    "fastapi>=0.162.0",
    "keyring>=25.7.0",
    "nautilus-trader==1.231.0",
    "pandas-market-calendars>=5",
    "pyotp>=2.10.0",
    "pywebview>=5.4 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "segno>=1.6.6",
    "tzdata>=2025.2",  # IANA time-zone data; Windows has none built in (CT dates, CME sessions)
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.18",
    "pandas-stubs>=3.1.0.261029",
    "pillow>=13.0.0",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pyinstaller>=6.11",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.14",
]

[tool.uv]
package = false
# NautilusTrader 1.231.0 pins fsspec==2026.2.0, which has CVE-2026-104851 (GHSA-27vj-qcqg-25rc,
# code execution via ReferenceFileSystem). Override to the fixed release; see DECISIONS.md D-04.
override-dependencies = [
    "fsspec>=2026.6.0",
    # databento pulls pip-system-certs on Windows, which patches Python's ssl module process-wide
    # at start-up. TLS behaviour must not change silently (DECISIONS.md D-14): never install it.
    "pip-system-certs; sys_platform == 'never'",
]
required-version = ">=0.11"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "PT", "TRY"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "PLR2004", "SLF001"]
# HTML templates: long markup lines read better unwrapped.
"engine/report.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["engine", "risk", "strategies", "api", "app", "tools", "tests"]

[[tool.mypy.overrides]]
# NautilusTrader is compiled (Cython/Rust) and ships no type stubs. Our own logic lives in typed
# pure-Python modules; only the thin Nautilus adapter modules touch these types.
module = ["nautilus_trader.*", "pandas_market_calendars.*", "webview.*", "webview"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["engine.nautilus.*", "strategies.*", "tests.*"]
disallow_subclassing_any = false
disallow_any_unimported = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    # pandas 3 deprecation warnings raised inside NautilusTrader's compiled code (not ours).
    "ignore::DeprecationWarning:nautilus_trader",
    "ignore:.*is deprecated and will be removed in a future version.*",
    # Starlette's TestClient advertises httpx2; httpx is the supported client today.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
