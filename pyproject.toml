[project]
name = "trading-agent-control-plane"
version = "0.1.0"
description = "Multi-Expert AI Trading System for Bill: engine, risk layer, control API and apps."
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Proprietary - all rights reserved by the repository owner" }
dependencies = [
    "tzdata>=2025.2",  # IANA time-zone data; Windows has none built in (CT dates, CME sessions)
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false
required-version = ">=0.11"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL", "PT", "TRY"]
ignore = ["PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
